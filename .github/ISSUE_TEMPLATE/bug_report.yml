name: Bug report
description: Something is broken.
labels: ["bug", "needs-triage"]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [macos, tui, desktop (Windows/Linux), ios, cloud, web (cmux.com), chatmux, shared]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "v1.3.0 / commit sha"
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Press ...
        3. Observe ...
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations: { required: true }
  - type: textarea
    id: proof
    attributes:
      label: Screenshot or recording
      description: A recording if it involves motion, focus or timing.
